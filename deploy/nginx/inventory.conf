# Ubuntu: วางที่ /etc/nginx/sites-available/inventory แล้วลิงก์ไป sites-enabled (และลบ sites-enabled/default)
# Nginx ทำ 2 หน้าที่: เสิร์ฟหน้าเว็บ (static) และ Reverse Proxy /api/ ไปยัง Node.js (127.0.0.1:3000)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/inventory;
    index index.html;

    # ต้องมากกว่าขนาดไฟล์รูปสูงสุดที่แอปรับ (5MB)
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
